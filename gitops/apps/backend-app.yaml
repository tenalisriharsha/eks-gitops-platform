# Child Application for sample-app/backend. Picked up automatically by the
# root app-of-apps Application (gitops/argocd/root-app.yaml), which
# recursively syncs everything under gitops/apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-backend
  namespace: argocd
spec:
  project: default
  source:
    # If you fork this repo, point this at your fork — see root-app.yaml.
    repoURL: https://github.com/tenalisriharsha/eks-gitops-platform.git
    targetRevision: main
    path: sample-app/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
