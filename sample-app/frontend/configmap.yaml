apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: sample-app
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head><title>sample-app</title></head>
      <body>
        <h1>sample-app</h1>
        <p>frontend &rarr; backend &rarr; cache, deployed end-to-end by ArgoCD.</p>
        <p>Backend health check: <a href="/api/">/api/</a></p>
      </body>
    </html>
  default.conf: |
    server {
      listen 8080;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location /api/ {
        proxy_pass http://backend:8080/;
      }
    }
