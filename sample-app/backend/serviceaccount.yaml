# Replace the eks.amazonaws.com/role-arn annotation with the `terraform
# output sample_app_irsa_role_arn` value from terraform/environments/dev
# after `terraform apply`. That IAM role (terraform/modules/irsa) trusts
# this exact namespace:service-account pair via the cluster's OIDC
# provider, so pods using this service account can assume it without
# static AWS credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: sample-app
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<cluster_name>-sample-app"
