apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: sample-app
      containers:
        - name: backend
          image: hashicorp/http-echo:1.0
          args:
            - -listen=:8080
            - -text=sample-app backend ok
          ports:
            - containerPort: 8080
          env:
            - name: CACHE_HOST
              value: cache
            - name: CACHE_PORT
              value: "6379"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
